name: Fix dashboard data and Reset 2

on:
  push:
    paths:
      - '.github/workflows/_fix_dashboard_data_reset2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          new_load="""async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now(),res=await fetch('data/dashboard.json?ts='+ts,{cache:'no-store'});if(!res.ok)throw Error('dashboard HTTP');DATA=await res.json();try{var sres=await fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'});SEL=sres.ok?parseCsv(await sres.text()):{}}catch(_e){SEL={}}var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"""
          s2,n=re.subn(r"async function load\(\)\{.*?\}\}function monthName", new_load+"function monthName", s, count=1)
          if n!=1:
              raise SystemExit('load function not found')
          s=s2

          reset="$('reset').onclick=function(){$('period').value='all';$('line').value='all';$('direction').value='all';$('from').value='';$('to').value='';$('from').hidden=true;$('to').hidden=true;PAGE=1;render()};"
          if "$('reset').onclick=" not in s:
              marker="$('refresh').onclick=load;"
              if marker not in s:
                  raise SystemExit('refresh handler not found')
              s=s.replace(marker,reset+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('inline script not found')
          Path('/tmp/dashboard.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix dashboard data loading and Reset button'
          git rm .github/workflows/_fix_dashboard_data_reset2.yml
          git commit -m 'Remove temporary dashboard fix workflow'
          git push
