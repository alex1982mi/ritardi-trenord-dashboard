name: Deploy dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch PDF export for deployment
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<script>(function(){')
          if start < 0:
              raise SystemExit('Inline PDF script not found')
          head, js = s[:start], s[start:]

          # jsPDF built-in Helvetica does not contain U+2194. Use an ASCII
          # bidirectional marker in the PDF only; the dashboard HTML keeps ↔.
          js = js.replace('Melzo ↔ Milano Repubblica', 'Melzo <-> Milano Repubblica')

          # Keep the historical chart note wrapped rather than stretched/clipped.
          old = "doc.text('La linea rappresenta il ritardo medio mensile accumulato esclusivamente sul tratto Melzo <-> Milano Repubblica.',left,110);"
          new = "var chartNote=doc.splitTextToSize('La linea rappresenta il ritardo medio mensile accumulato esclusivamente sul tratto Melzo <-> Milano Repubblica.',160);doc.text(chartNote,left,110);"
          if old in js:
              js = js.replace(old, new, 1)

          # Feed labels separated by black commas.
          old = "doc.textWithLink('Monitor Arrivi & Partenze Live',fx,y,{url:'https://www.rfi.it/it/stazioni/pagine-stazioni/servizi-di-qualita/informazioni-al-pubblico/monitor-arrivi-partenze-live.html'});fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+5;doc.textWithLink('Melzo',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&PlaceId=1690'});fx+=doc.getTextWidth('Melzo')+5;doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});"
          new = "doc.textWithLink('Monitor Arrivi & Partenze Live',fx,y,{url:'https://www.rfi.it/it/stazioni/pagine-stazioni/servizi-di-qualita/informazioni-al-pubblico/monitor-arrivi-partenze-live.html'});fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);fx+=doc.getTextWidth(',')+3;doc.setTextColor(0,102,204);doc.textWithLink('Melzo',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&PlaceId=1690'});fx+=doc.getTextWidth('Melzo')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);fx+=doc.getTextWidth(',')+3;doc.setTextColor(0,102,204);doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});"
          if old in js:
              js = js.replace(old, new, 1)

          # Methodology renderer: preserve ordinary spaces between words and
          # preserve the bold/normal segments from the requested layout.
          old = "function rich(segments){var fs=9.2,leading=4.45,max=165,words=[];segments.forEach(function(seg){seg.text.split(/(\\s+)/).forEach(function(w){if(w)words.push({text:w,bold:!!seg.bold})})});var line='',lineWords=[],lines=[];words.forEach(function(w){var test=line+w.text;setFont(w.bold?'bold':'normal',fs,[79,91,102]);if(line&&doc.getTextWidth(test)>max){lines.push(lineWords);line=w.text;lineWords=[w]}else{line=test;lineWords.push(w)}});if(lineWords.length)lines.push(lineWords);lines.forEach(function(ws){var x=left;ws.forEach(function(w){setFont(w.bold?'bold':'normal',fs,[79,91,102]);doc.text(w.text,x,y);x+=doc.getTextWidth(w.text)});y+=leading});y+=2.8;return y}"
          new = "function rich(segments){var fs=9.2,leading=4.45,max=165,tokens=[];segments.forEach(function(seg){seg.text.trim().split(/\\s+/).forEach(function(w){if(w)tokens.push({text:w,bold:!!seg.bold})})});var lines=[],cur=[],width=0;tokens.forEach(function(t){setFont(t.bold?'bold':'normal',fs,[79,91,102]);var add=(cur.length?' ':'')+t.text,w=doc.getTextWidth(add);if(cur.length&&width+w>max){lines.push(cur);cur=[t];width=doc.getTextWidth(t.text)}else{cur.push(t);width+=w}});if(cur.length)lines.push(cur);lines.forEach(function(ws){var x=left;ws.forEach(function(w,i){setFont(w.bold?'bold':'normal',fs,[79,91,102]);if(i)x+=doc.getTextWidth(' ');doc.text(w.text,x,y);x+=doc.getTextWidth(w.text)});y+=leading});y+=3.0;return y}"
          if old in js:
              js = js.replace(old, new, 1)

          p.write_text(head + js, encoding='utf-8')
          print('PDF deploy patch applied')
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
