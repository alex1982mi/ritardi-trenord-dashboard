name: Fix dashboard JS final once
on:
  push:
    branches: ["main"]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dashboard JavaScript final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(); s=s.replace("dall'orario previsto","dall\\u0027orario previsto",1); p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix dashboard JavaScript final"
          git push
