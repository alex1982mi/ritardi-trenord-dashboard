name: Update methodology once
on:
  push:
    paths:
      - '.github/workflows/_update_methodology_once.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update methodology text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<li>Le rilevazioni sono acquisite automaticamente da informazioni pubbliche RFI.</li></ul>'
          new = '<li>Le rilevazioni sono acquisite automaticamente da informazioni pubbliche RFI.</li><li><b>Gestione dei dati mancanti.</b> Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo ↔ Milano Repubblica), il dato viene ricostruito quando sono disponibili informazioni RFI sufficienti a determinarlo con ragionevole attendibilità. La ricostruzione può basarsi sul ritardo rilevato per la stessa corsa nell\'altro punto di osservazione oppure su informazioni di ritardo pubblicate da RFI in prossimità dell\'orario previsto. I dati ricostruiti non vengono stimati arbitrariamente: vengono utilizzate esclusivamente informazioni effettivamente disponibili nell\'archivio delle rilevazioni. Qualora non sussistano elementi sufficienti per una ricostruzione, il dato viene mantenuto come non disponibile.</li></ul>'
          if old not in s: raise SystemExit('Dashboard methodology anchor not found')
          s = s.replace(old, new, 1)
          oldpdf = "y=rich([{text:'Eventuali informazioni mancanti nel feed RFI restano tali: non vengono ricostruite, stimate o considerate automaticamente come puntualità, ritardo o cancellazione.'}]);"
          newpdf = "y=rich([{text:'Gestione dei dati mancanti. ',bold:true},{text:'Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo ↔ Milano Repubblica), il dato viene ricostruito quando sono disponibili informazioni RFI sufficienti a determinarlo con ragionevole attendibilità. La ricostruzione può basarsi sul ritardo rilevato per la stessa corsa nell\'altro punto di osservazione oppure su informazioni di ritardo pubblicate da RFI in prossimità dell\'orario previsto. I dati ricostruiti non vengono stimati arbitrariamente: vengono utilizzate esclusivamente informazioni effettivamente disponibili nell\'archivio delle rilevazioni. Qualora non sussistano elementi sufficienti per una ricostruzione, il dato viene mantenuto come non disponibile.'}]);"
          if oldpdf not in s: raise SystemExit('PDF methodology anchor not found')
          s = s.replace(oldpdf, newpdf, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/_update_methodology_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_update_methodology_once.yml
          git commit -m 'Update missing-data methodology'
          git push
