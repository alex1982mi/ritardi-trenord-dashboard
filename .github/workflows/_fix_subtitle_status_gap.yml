name: Fix subtitle status gap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix subtitle status gap applied'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.top{padding-top:21px;margin-bottom:18px}'
          new='.top{padding-top:21px;padding-bottom:18px;margin-bottom:0}'
          if old not in s:
              raise SystemExit('expected CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/_fix_subtitle_status_gap.yml
          git commit -m 'Fix subtitle status gap applied'
          git push
