name: Align PDF filters once
on:
  push:
    paths:
      - '.github/workflows/_align_pdf_filters_once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PDF spacing, labels and filename
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="function section(t,y){setFont('bold',13,[0,0,0]);doc.text(t,left,y);return y+7}"
          new="function section(t,y){setFont('bold',13,[0,0,0]);doc.text(t,left,y);return y+11}"
          if old not in s: raise SystemExit('section target not found')
          s=s.replace(old,new,1)
          old="function pl(){if(!a||!b)return'';var da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');if(a.slice(0,7)===b.slice(0,7))return monthName(da)+' '+da.getFullYear();if(a.slice(0,4)===b.slice(0,4))return monthName(da)+'–'+monthName(db)+' '+da.getFullYear();return fmtDate(a)+'–'+fmtDate(b)}"
          new="function pl(){if(!a||!b)return'';var da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');if(a.slice(0,7)===b.slice(0,7))return monthName(da)+' '+da.getFullYear();if(a.slice(0,4)===b.slice(0,4))return monthName(da)+'–'+monthName(db)+' '+da.getFullYear();return fmtDate(a)+'–'+fmtDate(b)}function reportLabel(){var parts=[pl()];if(line!=='all')parts.push(line);if(dir!=='all')parts.push(dir==='morning'?'Mattina':'Sera');return parts.filter(Boolean).join(' - ')}function fileLabel(){return reportLabel().replace(/–/g,'-').replace(/↔/g,'-').replace(/\\//g,'-').replace(/\\s+/g,'_')}"
          if old not in s: raise SystemExit('period target not found')
          s=s.replace(old,new,1)
          old="doc.text(pl(),W/2,y+31,{align:'center'});"
          new="doc.text(reportLabel(),W/2,y+31,{align:'center'});"
          if old not in s: raise SystemExit('header target not found')
          s=s.replace(old,new,1)
          old="doc.save('Monitoraggio_'+a+'_'+b+'.pdf')"
          new="doc.save('Monitoraggio_'+fileLabel()+'.pdf')"
          if old not in s: raise SystemExit('filename target not found')
          s=s.replace(old,new,1)
          old="y=doc.lastAutoTable.finalY+10;y=section('I miei viaggi',y);"
          new="y=doc.lastAutoTable.finalY+14;y=section('I miei viaggi',y);"
          if old not in s: raise SystemExit('personal spacing target not found')
          s=s.replace(old,new,1)
          old="y=doc.lastAutoTable.finalY+10;y=section('Confronto',y);"
          new="y=doc.lastAutoTable.finalY+14;y=section('Confronto',y);"
          if old not in s: raise SystemExit('comparison spacing target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/_align_pdf_filters_once.yml
          git commit -m 'Align PDF filter labels and spacing'
          git push origin main
