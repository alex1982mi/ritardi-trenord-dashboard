name: Fix PDF spacing
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply spacing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old1 = "doc.text(reportLabel(),W/2,y+31,{align:'center'});y=60.5;y=section('Situazione generale',y);"
          new1 = "doc.text(reportLabel(),W/2,y+31,{align:'center'});y=70;y=section('Situazione generale',y);"
          old2 = "fx+=doc.getTextWidth('Melzo')+5;doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});y+=5.5;y=rich([{text:'Il KPI misura il '"
          new2 = "fx+=doc.getTextWidth('Melzo')+5;doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});y+=7.25;y=rich([{text:'Il KPI misura il '"
          assert s.count(old1) == 1, f'first target count={s.count(old1)}'
          assert s.count(old2) == 1, f'second target count={s.count(old2)}'
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          PY
          node --check <(python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>(function(){')+len('<script>')
          b=s.rindex('</script>')
          print(s[a:b])
          PY
          )
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adjust PDF block spacing"
          git push
