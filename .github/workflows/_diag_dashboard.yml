name: Diagnose dashboard
on:
  push:
    paths:
      - '.github/workflows/_diag_dashboard.yml'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          out=[]
          out.append('async_load='+str('async function load(){' in s))
          out.append('monthName='+str('function monthName' in s))
          out.append('refresh='+str("$('refresh').onclick=load;" in s))
          out.append('reset='+str("$('reset').onclick=" in s))
          out.append('regex='+str(bool(re.search(r"async function load\(\)\{.*?\}\}function monthName",s))))
          out.append('len='+str(len(s)))
          Path('diag.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diag.txt
          git commit -m 'Add dashboard diagnostic'
          git rm .github/workflows/_diag_dashboard.yml
          git commit -m 'Remove dashboard diagnostic workflow'
          git push
