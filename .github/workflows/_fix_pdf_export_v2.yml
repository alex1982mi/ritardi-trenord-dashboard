name: Fix PDF export v2
on:
  push:
    paths:
      - '.github/workflows/_fix_pdf_export_v2.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PDF export
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          old="function section(t,y){setFont('bold',13,[0,0,0]);doc.text(t,left,y);return y+11}"
          new="function section(t,y){setFont('bold',13,[0,0,0]);doc.text(t,left,y);return y+15}"
          assert old in s, 'section function not found'
          s=s.replace(old,new,1)

          old="y=doc.lastAutoTable.finalY+14;y=section('I miei viaggi',y);"
          new="y=doc.lastAutoTable.finalY+18;y=section('I miei viaggi',y);"
          assert old in s, 'general-to-personal spacing not found'
          s=s.replace(old,new,1)

          old="y=doc.lastAutoTable.finalY+14;y=section('Confronto',y);"
          new="y=doc.lastAutoTable.finalY+18;y=section('Confronto',y);"
          assert old in s, 'personal-to-comparison spacing not found'
          s=s.replace(old,new,1)

          old="y=rich([{text:'Fonte dei dati. Le rilevazioni vengono acquisite automaticamente dal Monitor Arrivi & Partenze Live di RFI, utilizzando le informazioni pubblicamente disponibili per le stazioni di Melzo e Milano Repubblica.',bold:true}]);y=rich([{text:'Il KPI misura il '"
          new="y=rich([{text:'Fonte dei dati. Le rilevazioni vengono acquisite automaticamente dal Monitor Arrivi & Partenze Live di RFI, utilizzando le informazioni pubblicamente disponibili per le stazioni di Melzo e Milano Repubblica.',bold:true}]);setFont('normal',8.8,[79,91,102]);doc.text('Fonti RFI: ',left,y);var fx=left+doc.getTextWidth('Fonti RFI: ');doc.setTextColor(0,102,204);doc.textWithLink('Monitor Arrivi & Partenze Live',fx,y,{url:'https://www.rfi.it/it/stazioni/pagine-stazioni/servizi-di-qualita/informazioni-al-pubblico/monitor-arrivi-partenze-live.html'});fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+5;doc.textWithLink('Melzo',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&PlaceId=1690'});fx+=doc.getTextWidth('Melzo')+5;doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});y+=5.5;y=rich([{text:'Il KPI misura il '"
          assert old in s, 'source paragraph anchor not found'
          s=s.replace(old,new,1)

          old="doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(85,85,85);doc.text('Bozza grafica con dati fittizi.',left,y);doc.save('Monitoraggio_'+fileLabel()+'.pdf')"
          new="doc.save('Monitoraggio_'+fileLabel()+'.pdf')"
          assert old in s, 'draft note not found'
          s=s.replace(old,new,1)

          old="function fileLabel(){return reportLabel().replace(/–/g,'-').replace(/↔/g,'-').replace(/\\//g,'-').replace(/\\s+/g,'_')}"
          new="function fileLabel(){return reportLabel().replace(/–/g,'_').replace(/↔/g,'_').replace(/\\//g,'_').replace(/\\s+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')}"
          assert old in s, 'fileLabel function not found'
          s=s.replace(old,new,1)

          old="function fileLabel(){return reportLabel().replace(/–/g,'_').replace(/↔/g,'_').replace(/\\//g,'_').replace(/\\s+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')}"
          new="function fileLabel(){var label=reportLabel();return label.replace(/–/g,'_').replace(/↔/g,'_').replace(/\\//g,'_').replace(/\\s+/g,'_').replace(/-+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')}"
          assert old in s, 'updated fileLabel function not found'
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          m=re.search(r'<script>\(function\(\)\{.*?</script>',s,re.S)
          assert m, 'main script not found'
          Path('/tmp/dashboard.js').write_text(m.group(0)[8:-9])
          PY
          node --check /tmp/dashboard.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Refine PDF spacing, sources and filenames' || exit 0
          git push