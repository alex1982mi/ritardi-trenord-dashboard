name: Fix dashboard data and Reset

on:
  push:
    paths:
      - '.github/workflows/_fix_dashboard_data_reset.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = "async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now(),res=await Promise.all([fetch('data/dashboard.json?ts='+ts,{cache:'no-store'}),fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'})]);if(!res[0].ok||!res[1].ok)throw Error('HTTP');DATA=await res[0].json();SEL=parseCsv(await res[1].text());var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"
          new = "async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now(),res=await fetch('data/dashboard.json?ts='+ts,{cache:'no-store'});if(!res.ok)throw Error('dashboard HTTP');DATA=await res.json();try{var sres=await fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'});SEL=sres.ok?parseCsv(await sres.text()):{}}catch(_e){SEL={}}var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"
          if old not in s:
              raise SystemExit('load() target not found')
          s = s.replace(old, new, 1)

          marker = "$('period').onchange=function(){var c=this.value==='custom';$('from').hidden=!c;$('to').hidden=!c;PAGE=1};$('apply').onclick=function(){PAGE=1;render()};$('refresh').onclick=load;$('export').onclick=exportPdf;load()"
          replacement = "$('period').onchange=function(){var c=this.value==='custom';$('from').hidden=!c;$('to').hidden=!c;PAGE=1};$('apply').onclick=function(){PAGE=1;render()};$('reset').onclick=function(){$('period').value='all';$('line').value='all';$('direction').value='all';$('from').value='';$('to').value='';$('from').hidden=true;$('to').hidden=true;PAGE=1;render()};$('refresh').onclick=load;$('export').onclick=exportPdf;load()"
          if marker not in s:
              raise SystemExit('event-handler marker not found')
          s = s.replace(marker, replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY

          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', s, re.S)
          if not scripts:
              raise SystemExit('inline script not found')
          Path('/tmp/dashboard.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/dashboard.js

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_fix_dashboard_data_reset.yml
          git commit -m 'Fix dashboard data loading and Reset button' || exit 0
          git rm .github/workflows/_fix_dashboard_data_reset.yml
          git commit -m 'Remove temporary dashboard fix workflow'
          git push
