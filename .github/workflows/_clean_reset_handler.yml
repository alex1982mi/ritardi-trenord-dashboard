name: Clean reset handler
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Clean Reset handler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s2=re.sub(r"<script>document\.getElementById\('reset'\)\.onclick=.*?</script>","",s,count=1)
          assert s2 != s, 'duplicate external Reset handler not found'
          s=s2
          assert "$('reset').onclick=function()" in s, 'internal Reset handler missing'
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_clean_reset_handler.yml
          git commit -m "Clean Reset handler"
          git rm .github/workflows/_clean_reset_handler.yml
          git commit -m "Remove temporary cleanup workflow"
          git push
