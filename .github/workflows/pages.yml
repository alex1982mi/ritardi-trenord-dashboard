name: Deploy dashboard

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch PDF export for deployment
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<script>(function(){')
          if start < 0:
              raise SystemExit('Inline PDF script not found')
          head, js = s[:start], s[start:]

          js = js.replace('[[ARROW]]', '<>')

          js = re.sub(
              r"var _pdfText=doc\.text\.bind\(doc\);function _routeDraw\(t,x,y,o\)\{.*?\};(?=function setFont)",
              "",
              js,
              count=1,
              flags=re.S,
          )

          js = re.sub(
              r"function routeLabel\(y\)\{.*?\}routeLabel\(y\+13\);",
              "function routeLabel(y){doc.text('Melzo <> Milano Repubblica',W/2,y,{align:'center'})}routeLabel(y+13);",
              js,
              count=1,
              flags=re.S,
          )

          js = js.replace(
              "if(data.column.index===2&&data.cell.raw!=='—'){var positive=String(data.cell.raw).charAt(0)==='+';data.cell.styles.textColor=positive?[196,61,61]:[47,125,74]}",
              "if(data.column.index===2&&data.cell.raw!=='—')data.cell.styles.textColor=[0,102,204]"
          )

          js = js.replace(
              "if(i) x+=doc.getTextWidth(' ');doc.text(w.text,x,y);",
              "if(i && !/^[,.;:!?%)]/.test(w.text)) x+=doc.getTextWidth(' ');doc.text(w.text,x,y);"
          )

          js = js.replace(
              "fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);",
              "fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live');doc.setTextColor(0,0,0);doc.text(',',fx,y);"
          )
          js = js.replace(
              "fx+=doc.getTextWidth('Melzo')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);",
              "fx+=doc.getTextWidth('Melzo');doc.setTextColor(0,0,0);doc.text(',',fx,y);"
          )

          # Force the exact phrase into its own bold rich-text segment.
          phrase = 'il dato viene ricostruito quando sono disponibili informazioni RFI sufficienti a determinarlo'
          needle = "{text:'Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo / Milano Repubblica), il dato viene ricostruito quando sono disponibili informazioni RFI sufficienti a determinarlo con ragionevole attendibilità. "
          replacement = "{text:'Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo / Milano Repubblica), '},{text:'" + phrase + "',bold:true},{text:' con ragionevole attendibilità. "
          if needle in js:
              js = js.replace(needle, replacement, 1)
          else:
              raise SystemExit('Missing-data phrase not found in expected PDF rich-text block')

          p.write_text(head + js, encoding='utf-8')
          print('PDF formatting/runtime patch applied')
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
