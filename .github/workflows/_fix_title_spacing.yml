name: Fix title spacing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '.muted{color:#68737d;font-size:13px}'
          new = old + '.top h1{margin-bottom:0}'
          if '.top h1{margin-bottom:0}' in text:
              print('Fix already present')
          elif old in text:
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Fix applied')
          else:
              raise SystemExit('Target CSS string not found')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/_fix_title_spacing.yml
          git commit -m 'Riduci solo spazio tra titolo e sottotitolo'
          git push
