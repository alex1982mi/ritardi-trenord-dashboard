name: Repair dashboard now
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair dashboard now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reset="$('reset').onclick=function(){$('period').value='all';$('line').value='all';$('direction').value='all';$('from').value='';$('to').value='';$('from').hidden=true;$('to').hidden=true;PAGE=1;render()};"
          if "$('reset').onclick=" not in s:
              marker="$('refresh').onclick=load;"
              if marker not in s: raise SystemExit('refresh handler not found')
              s=s.replace(marker,reset+marker,1)
          start=s.find('async function load(){')
          end=s.find("$('refresh').onclick=load;", start)
          if start<0 or end<0: raise SystemExit('load function not found')
          new="async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now();var res=await fetch('data/dashboard.json?ts='+ts,{cache:'no-store'});if(!res.ok)throw Error('dashboard HTTP');DATA=await res.json();SEL={};try{var sres=await fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'});if(sres.ok)SEL=parseCsv(await sres.text())}catch(_e){}var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          parts=s.split('<script>')
          if len(parts)<2: raise SystemExit('inline script missing')
          js=parts[-1].split('</script>',1)[0]
          Path('/tmp/dashboard.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
          grep -q "$('reset').onclick=" index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair dashboard now'
          git push
