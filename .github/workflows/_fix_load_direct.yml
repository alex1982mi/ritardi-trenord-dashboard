name: Fix dashboard load direct
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dashboard load direct'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          pat=r"var ts=Date\.now\(\),res=await Promise\.all\(\[fetch\('data/dashboard\.json\?ts='\+ts,\{cache:'no-store'\}\),fetch\('data/personal_selections\.csv\?ts='\+ts,\{cache:'no-store'\}\)\]\);if\(!res\[0\]\.ok\|\|!res\[1\]\.ok\)throw Error\('HTTP'\);DATA=await res\[0\]\.json\(\);SEL=parseCsv\(await res\[1\]\.text\(\)\);"
          repl="var ts=Date.now(),res=await fetch('data/dashboard.json?ts='+ts,{cache:'no-store'});if(!res.ok)throw Error('dashboard HTTP');DATA=await res.json();SEL={};try{var sres=await fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'});if(sres.ok)SEL=parseCsv(await sres.text())}catch(_e){}"
          s2,n=re.subn(pat,repl,s,count=1)
          print('load replacements:',n)
          if n!=1: raise SystemExit('load pattern not found')
          p.write_text(s2,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix dashboard load direct'
          git push
