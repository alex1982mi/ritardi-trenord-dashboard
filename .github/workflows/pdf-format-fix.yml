name: Fix PDF typography

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix PDF typography' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch PDF export
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<script>(function(){')
          if start < 0:
              raise SystemExit('Inline PDF script not found')
          head, js = s[:start], s[start:]

          marker = '[[ARROW]]'
          js = js.replace('↔', marker)

          inject = '''var _pdfText=doc.text.bind(doc);function _routeDraw(t,x,y,o){var parts=String(t).split("[[ARROW]]"),aw=8,gap=2,total=0,i;for(i=0;i<parts.length;i++){total+=doc.getTextWidth(parts[i]);if(i<parts.length-1)total+=aw+gap*2}var xx=x;if(o&&o.align==='center')xx=x-total/2;for(i=0;i<parts.length;i++){if(parts[i]){_pdfText(parts[i],xx,y,{align:'left'});xx+=doc.getTextWidth(parts[i])}if(i<parts.length-1){xx+=gap;var ay=y-1.4;doc.setDrawColor(104,115,125);doc.setLineWidth(0.35);doc.line(xx,ay,xx+aw,ay);doc.line(xx,ay,xx+2,ay-1.2);doc.line(xx,ay,xx+2,ay+1.2);doc.line(xx+aw,ay,xx+aw-2,ay-1.2);doc.line(xx+aw,ay,xx+aw-2,ay+1.2);xx+=aw+gap}}}doc.text=function(t,x,y,o){if(Array.isArray(t)){for(var i=0;i<t.length;i++){if(String(t[i]).indexOf("[[ARROW]]")>=0)_routeDraw(t[i],x,y+i*(doc.getFontSize()*0.3528*1.15),o);else _pdfText(t[i],x,y+i*(doc.getFontSize()*0.3528*1.15),o)}return doc}if(typeof t==='string'&&t.indexOf("[[ARROW]]")>=0){_routeDraw(t,x,y,o);return doc}return _pdfText(t,x,y,o)};'''

          m = re.search(r'var doc=new [^;]+;', js) or re.search(r'(?:var )?doc\s*=\s*new [^;]+;', js)
          if not m:
              raise SystemExit('jsPDF constructor not found')
          js = js[:m.end()] + inject + js[m.end():]

          old_note = "doc.text('La linea rappresenta il ritardo medio mensile accumulato esclusivamente sul tratto Melzo [[ARROW]] Milano Repubblica.',left,110);"
          new_note = "var chartNote=doc.splitTextToSize('La linea rappresenta il ritardo medio mensile accumulato esclusivamente sul tratto Melzo [[ARROW]] Milano Repubblica.',160);doc.text(chartNote,left,110);"
          js = js.replace(old_note, new_note, 1)

          old = "doc.textWithLink('Monitor Arrivi & Partenze Live',fx,y,{url:'https://www.rfi.it/it/stazioni/pagine-stazioni/servizi-di-qualita/informazioni-al-pubblico/monitor-arrivi-partenze-live.html'});fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+5;doc.textWithLink('Melzo',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&PlaceId=1690'});fx+=doc.getTextWidth('Melzo')+5;doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});"
          new = "doc.textWithLink('Monitor Arrivi & Partenze Live',fx,y,{url:'https://www.rfi.it/it/stazioni/pagine-stazioni/servizi-di-qualita/informazioni-al-pubblico/monitor-arrivi-partenze-live.html'});fx+=doc.getTextWidth('Monitor Arrivi & Partenze Live')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);fx+=doc.getTextWidth(',')+3;doc.setTextColor(0,102,204);doc.textWithLink('Melzo',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=False&PlaceId=1690'});fx+=doc.getTextWidth('Melzo')+3;doc.setTextColor(0,0,0);doc.text(',',fx,y);fx+=doc.getTextWidth(',')+3;doc.setTextColor(0,102,204);doc.textWithLink('Milano Repubblica',fx,y,{url:'https://iechub.rfi.it/ArriviPartenze/ArrivalsDepartures/Monitor?Arrivals=True&PlaceId=1719'});"
          js = js.replace(old, new, 1)

          js = js.replace('Monitor Arrivi & Partenze LiveMelzo Milano Repubblica','Monitor Arrivi & Partenze Live, Melzo, Milano Repubblica')
          js = js.replace('(Melzo [[ARROW]] Milano Repubblica)','(Melzo / Milano Repubblica)')

          p.write_text(head + js, encoding='utf-8')
          print('PDF typography patch applied')
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix PDF typography"
          git push