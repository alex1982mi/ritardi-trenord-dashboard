name: Fine tuning favicon e label

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fine-tuning:
    if: ${{ !contains(github.event.head_commit.message, '[fine-tuning]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Applica modifiche
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes = {
              'index.html': 'favicon-treni.svg',
              'mio-viaggio.html': 'favicon-viaggi.svg',
          }

          for filename, favicon in changes.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              link = f'<link rel="icon" type="image/svg+xml" href="{favicon}">'
              if 'rel="icon"' not in text:
                  text = text.replace('<title>', link + '<title>', 1)

              text = text.replace('>Ritardo accumulato<', '>Ritardo cumul.<')
              text = text.replace('"Ritardo accumulato"', '"Ritardo cumul."')
              text = text.replace("'Ritardo accumulato'", "'Ritardo cumul.'")
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit finale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mio-viaggio.html
          git rm .github/workflows/fine-tuning.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fine tuning favicon e label [fine-tuning]"
          git push
