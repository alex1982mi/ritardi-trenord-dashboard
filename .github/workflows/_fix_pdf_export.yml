name: Fix PDF export
on:
  push:
    paths:
      - '.github/workflows/_fix_pdf_export.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix jsPDF AutoTable check
        run: |
          python - <<'PY'
          p='index.html'
          t=open(p,encoding='utf-8').read()
          old="typeof window.jspdf.jsPDF.prototype.autoTable!=='function'"
          new="typeof window.jspdf.jsPDF.API.autoTable!=='function'"
          if old not in t:
              raise SystemExit('pattern not found')
          t=t.replace(old,new,1)
          open(p,'w',encoding='utf-8').write(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix export PDF AutoTable detection'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm .github/workflows/_fix_pdf_export.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary PDF fix workflow' || true
          git push || true
