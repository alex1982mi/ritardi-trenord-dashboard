name: Restore stable dashboard once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore stable dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known good dashboard and apply UI safely
        shell: bash
        run: |
          set -euo pipefail
          git show 36d7379700ea1ffc03758b417630a1f4ac516918:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div><button id="refresh" class="refresh">↻ Aggiorna dati</button> <button id="export" class="export">↓ Scarica PDF</button></div>'
          new = '<div><button id="refresh" class="refresh">↻ Aggiorna dati</button></div>'
          if old not in s: raise SystemExit('status button pattern not found')
          s = s.replace(old, new, 1)
          old = '<button id="apply">Applica</button>'
          new = '<button id="apply">Applica</button> <button id="reset" class="reset">Reset</button> <button id="export" class="export">↓ Scarica PDF</button>'
          if old not in s: raise SystemExit('apply button pattern not found')
          s = s.replace(old, new, 1)
          old = 'button{cursor:pointer}.refresh,.export{font-weight:700}.export{background:#17202a;color:#fff;border-color:#17202a}'
          new = 'button{cursor:pointer}.refresh,.export,.reset{font-weight:700}.export,.reset{background:#17202a;color:#fff;border-color:#17202a}'
          if old not in s: raise SystemExit('button css pattern not found')
          s = s.replace(old, new, 1)
          marker = '})();</script></body></html>'
          extra = "document.getElementById('reset').onclick=function(){document.getElementById('period').value='all';document.getElementById('line').value='all';document.getElementById('direction').value='all';document.getElementById('from').value='';document.getElementById('to').value='';document.getElementById('from').hidden=true;document.getElementById('to').hidden=true;PAGE=1;render();};"
          if marker not in s: raise SystemExit('IIFE end marker not found')
          s = s.replace(marker, extra + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.rfind('(function(){')
          end=s.rfind('</body></html>')
          if start < 0 or end <= start: raise SystemExit('cannot isolate dashboard JS')
          Path('/tmp/dashboard.js').write_text(s[start:end], encoding='utf-8')
          PY
          node --check /tmp/dashboard.js
          grep -q 'id="reset"' index.html
          grep -q "document.getElementById('reset').onclick" index.html
      - name: Commit restored dashboard and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_restore_dashboard_once.yml
          git commit -m "Restore stable dashboard"
          git push
