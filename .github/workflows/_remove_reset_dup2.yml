name: Remove Reset duplicate 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Remove Reset duplicate 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate Reset script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker="<script>document.getElementById('reset').onclick"
          start=s.find(marker)
          assert start>=0, 'duplicate Reset script not found'
          end=s.find('</script>',start)
          assert end>=0, 'duplicate Reset script end not found'
          s=s[:start]+s[end+9:]
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_remove_reset_dup2.yml
          git commit -m "Remove Reset duplicate 2"
          git rm .github/workflows/_remove_reset_dup2.yml
          git commit -m "Remove temporary Reset cleanup workflow"
          git push
