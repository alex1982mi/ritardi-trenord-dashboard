name: Syntax diagnostic
on: push
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/dashboard.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/dashboard.js > syntax.txt 2>&1 || true
          echo '---RESET---' >> syntax.txt
          grep -o "\$('reset')\.onclick=" index.html >> syntax.txt || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add syntax.txt
          git commit -m 'Add dashboard syntax diagnostic'
          git push
