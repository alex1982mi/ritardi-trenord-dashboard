name: Rollback dashboard to last known good
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rollback:
    if: github.event.head_commit.message != 'Rollback dashboard to last known good'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index.html
        run: |
          git fetch --no-tags origin 4c7044caf8aef5b03a34c39cb223f157336aafe2
          git checkout 4c7044caf8aef5b03a34c39cb223f157336aafe2 -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Rollback dashboard to last known good'
          git push
