name: Patch dashboard loader
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="""async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now(),res=await Promise.all([fetch('data/dashboard.json?ts='+ts,{cache:'no-store'}),fetch('data/personal_selections.csv?ts='+ts,{cache:'no-store'})]);if(!res[0].ok||!res[1].ok)throw Error('HTTP');DATA=await res[0].json();SEL=parseCsv(await res[1].text());var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"""
          new="""async function load(){setStatus(true,'Aggiornamento in corso…');try{var ts=Date.now(),r=await fetch('./data/dashboard.json?ts='+ts,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);var json=await r.json();if(!json||!Array.isArray(json.episodes))throw Error('Formato dati non valido');DATA=json;try{var pr=await fetch('./data/personal_selections.csv?ts='+ts,{cache:'no-store'});if(pr.ok)SEL=parseCsv(await pr.text())}catch(e){SEL={}}var dt=new Date(DATA.generated_at);setStatus(true,'Ultimo aggiornamento: '+dt.toLocaleString('it-IT',{dateStyle:'short',timeStyle:'medium'}));PAGE=1;render()}catch(e){setStatus(false,'Impossibile aggiornare i dati.');if(DATA.episodes.length)render()}}"""
          if old not in s: raise SystemExit('pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix dashboard data loading"
          git push