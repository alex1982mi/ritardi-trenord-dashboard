name: Fine tuning label dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-label:
    if: ${{ !contains(github.event.head_commit.message, '[label-fine-tuning]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sostituisci label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('Ritardo accumulato', 'Ritardo cumul.')
          text = text.replace('ritardo accumulato', 'ritardo cumul.')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit finale
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/label-fine-tuning.yml
          git diff --cached --quiet && exit 0
          git commit -m "Cambia label ritardo accumulato [label-fine-tuning]"
          git push
