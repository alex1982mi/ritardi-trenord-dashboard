name: Verify dashboard once
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/dashboard.js').write_text(js)
          PY
          node --check /tmp/dashboard.js
      - name: Verify published data
        run: |
          set -eux
          curl -fsS 'https://alex1982mi.github.io/ritardi-trenord-dashboard/data/dashboard.json' -o /tmp/live.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/live.json'))
          assert isinstance(d.get('episodes'),list) and d['episodes'], 'episodes missing'
          print('LIVE generated_at:', d.get('generated_at'))
          print('LIVE episodes:', len(d['episodes']))
          PY
      - name: Verify published HTML
        run: |
          curl -fsS 'https://alex1982mi.github.io/ritardi-trenord-dashboard/' -o /tmp/live.html
          grep -q "data/dashboard.json" /tmp/live.html
          echo 'LIVE HTML loader present'
