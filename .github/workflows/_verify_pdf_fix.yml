name: Verify PDF fix
on:
  push:
    paths:
      - '.github/workflows/_verify_pdf_fix.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          python - <<'PY'
          t=open('index.html',encoding='utf-8').read()
          assert "typeof window.jspdf.jsPDF.API.autoTable!=='function'" in t, 'PDF check not fixed'
          assert "typeof window.jspdf.jsPDF.prototype.autoTable!=='function'" not in t, 'old PDF check still present'
          print('PDF EXPORT CHECK: OK')
          PY
      - name: Cleanup temporary workflows
        if: always()
        run: |
          for f in .github/workflows/_verify_pdf_fix.yml .github/workflows/_diagnose_pdf.yml .github/workflows/_diagnose_pdf2.yml .github/workflows/_fix_pdf_export.yml .github/workflows/_fix_top_status_gap.yml .github/workflows/_fix_subtitle_status_gap.yml; do
            git rm -f "$f" 2>/dev/null || true
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Cleanup temporary maintenance workflows' || true
          git push || true
