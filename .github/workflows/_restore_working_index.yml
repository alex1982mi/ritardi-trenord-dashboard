name: Restore working dashboard
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.event.head_commit.message != 'Restore working dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore index
        run: |
          git checkout 0a95696 -- index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore working dashboard'
          git push
