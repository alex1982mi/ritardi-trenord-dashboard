name: Fix dashboard JS once
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix dashboard JavaScript'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fix apostrophe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="nell'altro"
          new="nell\\'altro"
          if old not in s: raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix dashboard JavaScript"
          git push
