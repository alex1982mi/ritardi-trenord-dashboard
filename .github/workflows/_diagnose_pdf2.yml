name: Diagnose PDF 2
on:
  push:
    paths:
      - '.github/workflows/_diagnose_pdf2.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PDF code
        run: |
          python - <<'PY'
          t=open('index.html',encoding='utf-8').read()
          keys=['exportPdf','PDF','jspdf','autoTable','export']
          for key in keys:
              print('\n###',key)
              start=0; n=0
              while True:
                  i=t.lower().find(key.lower(),start)
                  if i<0 or n>=8: break
                  print(t[max(0,i-350):min(len(t),i+900)])
                  start=i+len(key); n+=1
          PY
