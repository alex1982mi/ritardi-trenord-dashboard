name: Fix PDF export once
on:
  push:
    paths:
      - '.github/workflows/_fix_pdf_export_once.yml'
permissions:
  contents: write
  pages: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch PDF export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('function exportPdf(){')
          end = s.index("$('period').onchange=function(){", start)
          new = r'''function exportPdf(){var rows=filtered(),r=range(),a=r[0],b=r[1],line=$('line').value,dir=$('direction').value,pr=previousRows(),g=calc(rows),pg=calc(pr),pv=personalValues();if(!a){a=DATA.episodes.length?DATA.episodes.map(function(e){return e.service_date}).sort()[0]:iso(new Date())}if(!b)b=iso(new Date());if(!window.jspdf||!window.jspdf.jsPDF||typeof window.jspdf.jsPDF.API.autoTable!=='function'){alert('La funzione PDF non è disponibile.');return}var doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,left=19.1,tableLeft=25.0,tableWidth=160;function setFont(style,size,color){doc.setFont('helvetica',style);doc.setFontSize(size);if(color)doc.setTextColor(color[0],color[1],color[2])}function title(t,size,y){setFont('bold',size,[0,0,0]);doc.text(t,W/2,y,{align:'center'})}function section(t,y){setFont('bold',13,[0,0,0]);doc.text(t,left,y);return y+7}function monthName(d){return['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'][d.getMonth()]}function fmtDate(s){return s?new Date(s+'T00:00:00').toLocaleDateString('it-IT'):''}function pl(){if(!a||!b)return'';var da=new Date(a+'T00:00:00'),db=new Date(b+'T00:00:00');if(a.slice(0,7)===b.slice(0,7))return monthName(da)+' '+da.getFullYear();if(a.slice(0,4)===b.slice(0,4))return monthName(da)+'–'+monthName(db)+' '+da.getFullYear();return fmtDate(a)+'–'+fmtDate(b)}function pctDelta(cur,prev){if(!prev)return'—';var ch=(cur-prev)/prev*100;if(Math.abs(ch)<0.05)return'—';return(ch>0?'+':'−')+Math.abs(ch).toFixed(0)+'%'}function drawArrow(cell,up){var x=cell.x+cell.width-5.5,y=cell.y+cell.height/2;doc.setDrawColor(up?196:47,up?61:125,up?61:74);doc.setLineWidth(0.35);if(up){doc.line(x,y+1.8,x,y-1.8);doc.line(x,y-1.8,x-1.1,y-0.4);doc.line(x,y-1.8,x+1.1,y-0.4)}else{doc.line(x,y-1.8,x,y+1.8);doc.line(x,y+1.8,x-1.1,y+0.4);doc.line(x,y+1.8,x+1.1,y+0.4)}}function tableStyle(){return{theme:'grid',tableWidth:tableWidth,margin:{left:tableLeft,right:210-tableLeft-tableWidth},styles:{font:'helvetica',fontSize:10,textColor:[0,0,0],cellPadding:1.25,lineColor:[200,207,213],lineWidth:0.2,halign:'left',valign:'middle'},headStyles:{fillColor:[233,238,242],textColor:[0,0,0],font:'helvetica',fontStyle:'bold',halign:'center',cellPadding:1.25},columnStyles:{0:{cellWidth:72,halign:'left'},1:{cellWidth:38,halign:'center'},2:{cellWidth:50,halign:'center'}},didParseCell:function(data){if(data.section==='body'&&data.column.index>0){data.cell.styles.fontStyle='bold';data.cell.styles.halign='center';if(data.column.index===2&&data.cell.raw!=='—'){var positive=String(data.cell.raw).charAt(0)==='+';data.cell.styles.textColor=positive?[196,61,61]:[47,125,74]}}},didDrawCell:function(data){if(data.section==='body'&&data.column.index===2&&data.cell.raw!=='—'&&String(data.cell.raw).match(/^[+−]/)){drawArrow(data.cell,String(data.cell.raw).charAt(0)==='+')}}}}function pc(){var t=pv.reduce(function(x,y){return x+y},0);return{runs:pv.length,delayed:pv.filter(function(x){return x>0}).length,avg:pv.length?t/pv.length:0,cancel:0}}var p=pc(),y=24;title('MONITORAGGIO DEL SERVIZIO FERROVIARIO',18,y);setFont('normal',10,[104,115,125]);doc.text('Trenord · Linee '+(line==='all'?'S5–S6':line),W/2,y+7,{align:'center'});doc.text('Melzo  –  Milano Repubblica',W/2,y+13,{align:'center'});doc.setDrawColor(207,214,219);doc.setLineWidth(0.5);doc.line(left,y+18,W-left,y+18);setFont('bold',13,[0,0,0]);doc.text(pl(),W/2,y+31,{align:'center'});y=60.5;y=section('Situazione generale',y);doc.autoTable(Object.assign({startY:y,head:[['Indicatore',pl(),'Stesso periodo precedente']],body:[['Corse monitorate',g.runs,'—'],['Corse con ritardo',g.delayed,pctDelta(g.delayed,pg.delayed)],['Ritardo medio',g.avg.toFixed(1).replace('.',',')+' min',pctDelta(g.avg,pg.avg)],['Cancellazioni',g.cancel,pctDelta(g.cancel,pg.cancel)]]},tableStyle()));y=doc.lastAutoTable.finalY+10;y=section('I miei viaggi',y);doc.autoTable(Object.assign({startY:y,head:[['Indicatore',pl(),'Stesso periodo precedente']],body:[['Viaggi registrati',p.runs,'—'],['Viaggi con ritardo',p.delayed,pctDelta(p.delayed,pg.personal_delayed)],['Ritardo medio',p.avg.toFixed(1).replace('.',',')+' min',pctDelta(p.avg,pg.personal_avg)],['Cancellazioni',p.cancel,pctDelta(p.cancel,pg.personal_cancel)]]},tableStyle()));y=doc.lastAutoTable.finalY+10;y=section('Confronto',y);setFont('normal',8.8,[0,0,0]);var intro='Il confronto mette in relazione la situazione generale delle corse monitorate con quella delle corse registrate come viaggi personali. Il dato personale rappresenta quindi una parte del servizio complessivamente monitorato e consente di verificare come i risultati delle corse effettivamente utilizzate si rapportino all\'andamento generale del periodo.';var introLines=doc.splitTextToSize(intro,160);doc.text(introLines,left,y);y+=introLines.length*4.1+5;doc.autoTable(Object.assign({startY:y,head:[['Indicatore','Generale','Personale']],body:[['Ritardo medio',g.avg.toFixed(1).replace('.',',')+' min',p.avg.toFixed(1).replace('.',',')+' min'],['Corse/viaggi con ritardo',g.runs?(g.delayed/g.runs*100).toFixed(1).replace('.',',')+'%':'—',p.runs?(p.delayed/p.runs*100).toFixed(1).replace('.',',')+'%':'—'],['Cancellazioni',g.cancel,p.cancel]]},tableStyle()));doc.addPage();y=21;setFont('bold',13,[0,0,0]);doc.text('Andamento storico',left,y);y=33.5;setFont('normal',8.8,[0,0,0]);doc.text('L\'andamento mostra l\'evoluzione del ritardo medio mensile sul collegamento monitorato.',left,y);setFont('bold',8.8,[79,91,102]);doc.text('Ritardo medio sul tratto (minuti)',left,41.0);var allTrend=DATA.episodes.filter(function(e){return Number.isFinite(e.segment_delay)&&(line==='all'||e.line===line)&&(dir==='all'||e.direction===dir)}),by={};allTrend.forEach(function(e){var k=e.service_date.slice(0,7);(by[k]??=[]).push(e.segment_delay)});var months=Object.keys(by).sort(),vals=months.map(function(k){return by[k].reduce(function(x,z){return x+z},0)/by[k].length});var gx=25.1,gy=98.0,gw=149.4,gh=52.5,maxv=Math.max(8,Math.ceil(Math.max.apply(null,[2].concat(vals.map(function(x){return x})))));maxv=Math.ceil(maxv/2)*2;doc.setDrawColor(223,228,232);doc.setLineWidth(0.25);for(var i=0;i<=4;i++){var yy=gy-gh*i/4;doc.line(gx,yy,gx+gw,yy);setFont('normal',7,[104,115,125]);doc.text(String(Math.round(maxv*i/4)),gx-4.5,yy+1.5,{align:'right'})}var pts=[];months.forEach(function(k,i){var xx=months.length===1?gx+gw/2:gx+gw*i/(months.length-1),yy=gy-gh*(vals[i]/maxv);pts.push([xx,yy]);setFont('normal',7,[79,91,102]);doc.text(monthName(new Date(k+'-01T00:00:00')).slice(0,3),xx,gy+6.5,{align:'center'});setFont('normal',7,[79,91,102]);doc.text(vals[i].toFixed(1),xx,yy-2.2,{align:'center'});doc.setFillColor(79,91,102);doc.circle(xx,yy,0.9,'F')});doc.setDrawColor(79,91,102);doc.setLineWidth(0.65);for(i=1;i<pts.length;i++)doc.line(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);setFont('normal',8.8,[79,91,102]);doc.text('La linea rappresenta il ritardo medio mensile accumulato esclusivamente sul tratto Melzo – Milano Repubblica.',left,110.0);doc.addPage();y=21;setFont('bold',13,[0,0,0]);doc.text('Metodologia',left,y);y=28.0;function rich(segments){var fs=9.2,leading=4.45,max=165,words=[];segments.forEach(function(seg){var arr=seg.text.split(/(\s+)/);arr.forEach(function(w){if(w)words.push({text:w,bold:!!seg.bold})})});var line='',lineWords=[],lines=[];words.forEach(function(w){var test=line+w.text;setFont(w.bold?'bold':'normal',fs,[79,91,102]);if(line&&doc.getTextWidth(test)>max){lines.push(lineWords);line=w.text;lineWords=[w]}else{line=test;lineWords.push(w)}});if(lineWords.length)lines.push(lineWords);lines.forEach(function(ws){var x=left;ws.forEach(function(w){setFont(w.bold?'bold':'normal',fs,[79,91,102]);doc.text(w.text,x,y);x+=doc.getTextWidth(w.text)});y+=leading});y+=2.8;return y}y=rich([{text:'Fonte dei dati. Le rilevazioni vengono acquisite automaticamente dal Monitor Arrivi & Partenze Live di RFI, utilizzando le informazioni pubblicamente disponibili per le stazioni di Melzo e Milano Repubblica.',bold:true}]);y=rich([{text:'Il KPI misura il '},{text:'ritardo accumulato sul tratto Melzo – Milano Repubblica di Trenord',bold:true},{text:'. Il ritardo a Melzo e il ritardo a Milano Repubblica sono quelli riportati da RFI per il treno nel momento in cui viene osservato nella rispettiva stazione: non rappresentano quindi necessariamente il ritardo alla stazione iniziale e finale dell\'intero viaggio del treno.'}]);y=rich([{text:'Le cancellazioni vengono conteggiate quando risultano esplicitamente indicate dalla fonte.'}]);y=rich([{text:'Le corse monitorate, sia di andata sia di ritorno, corrispondono alle corse Trenord S5 e S6 nelle '},{text:'fasce orarie abituali 08:00–09:00 e 18:00–19:00',bold:true},{text:', utilizzate per raggiungere e rientrare dall\'ufficio.'}]);y=rich([{text:'Il dato relativo ai '},{text:'I miei viaggi riguarda le corse effettivamente indicate tramite apposito pannello',bold:true},{text:' come utilizzate, sulla base di data, direzione e corsa. A ciascuna registrazione vengono associati i dati rilevati per la specifica corsa, così da determinare il ritardo maturato sul tratto percorso.'}]);y=rich([{text:'Le variazioni sono confrontate con lo stesso intervallo di tempo precedente.'}]);y=rich([{text:'Eventuali informazioni mancanti nel feed RFI restano tali: non vengono ricostruite, stimate o considerate automaticamente come puntualità, ritardo o cancellazione.'}]);y=rich([{text:'La disponibilità e completezza del feed dipendono dalla fonte utilizzata e non dal sistema di monitoraggio.',bold:true}]);y=rich([{text:'Il registro descrive la circolazione ferroviaria osservata e i viaggi registrati e non costituisce, da solo, prova della presenza individuale o dell\'orario di ingresso al lavoro.'}]);doc.setFont('helvetica','italic');doc.setFontSize(8.5);doc.setTextColor(85,85,85);doc.text('Bozza grafica con dati fittizi.',left,y);doc.save('Monitoraggio_'+a+'_'+b+'.pdf')}'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/_fix_pdf_export_once.yml
          git commit -m 'Align PDF export with approved layout'
          git push origin main
