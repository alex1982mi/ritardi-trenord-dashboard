name: Fix and deploy PDF

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'Apply PDF fixes' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Patch PDF generator
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('<script>(function(){')
          if start<0: raise SystemExit('Inline script not found')
          head,js=s[:start],s[start:]

          js=js.replace('↔','<>')
          js=js.replace('Live , Melzo , Milano Repubblica','Live, Melzo, Milano Repubblica')
          js=js.replace('18:00–19:00 , utilizzate','18:00–19:00, utilizzate')

          m=re.search(r'(var|let|const)\s+doc\s*=\s*new\s+[^;]+;',js)
          if not m: raise SystemExit('jsPDF constructor not found')
          inject="var _at=doc.autoTable.bind(doc);doc.autoTable=function(o){o=o||{};var old=o.didParseCell;o.didParseCell=function(d){if(old)old(d);if(o.head&&JSON.stringify(o.head).indexOf('Personale')>=0&&d.section==='body'&&d.column&&d.column.index===2)d.cell.styles.textColor=[0,102,204]};return _at(o)};"
          js=js[:m.end()]+inject+js[m.end():]

          phrase="il dato viene ricostruito quando sono disponibili informazioni RFI sufficienti a determinarlo"
          needle="{text:'Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo / Milano Repubblica), "+phrase
          repl="{text:'Qualora una rilevazione non risulti disponibile in uno dei punti di osservazione (Melzo / Milano Repubblica), '},{text:'"+phrase+"',bold:true},{text:'"
          if needle not in js: raise SystemExit('Missing-data phrase source not found')
          js=js.replace(needle,repl,1)

          p.write_text(head+js,encoding='utf-8')
          print('PDF fixes applied')
      - name: Commit patched generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix PDF generator"
          git push
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
