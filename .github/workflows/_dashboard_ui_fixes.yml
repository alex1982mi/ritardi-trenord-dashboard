name: Apply dashboard UI fixes

on:
  push:
    paths:
      - '.github/workflows/_dashboard_ui_fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'Distribuzione dei ritardi sul tratto': 'Distribuzione dei ritardi sulle tratte',
              'Viaggi registrati': 'Viaggi con ritardo',
              "return a.service_date.localeCompare(b.service_date)||a.origin_scheduled_time.localeCompare(b.origin_scheduled_time)": "return b.service_date.localeCompare(a.service_date)||b.origin_scheduled_time.localeCompare(a.origin_scheduled_time)"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(x for x in re.findall(r'<script(?: [^>]*)?>(.*?)</script>', s, re.S) if x.strip())
          Path('/tmp/dashboard.js').write_text(js, encoding='utf-8')
          subprocess.run(['node','--check','/tmp/dashboard.js'], check=True)
          PY
      - name: Commit UI fixes and remove temporary workflow
        run: |
          rm .github/workflows/_dashboard_ui_fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/_dashboard_ui_fixes.yml
          git commit -m 'Refine dashboard labels and episode order'
          git push
